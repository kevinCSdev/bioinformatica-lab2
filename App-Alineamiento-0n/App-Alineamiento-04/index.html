<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Bioinformática UBB</title>
	<link rel="icon" href="./images/favicon.ico" type="image/x-icon" />
	<!-- Aquí está la línea que agregamos -->
	<link rel="stylesheet" href="./style.css" />
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
	<link href="https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css" rel="stylesheet" />
	<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
	<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<body>
	<nav class="sidebar close">
		<header>
			<div class="image-text">
				<div class="image">
					<img src="./images/ubb.png" alt="" />
				</div>
			</div>
			<i class="bx bx-chevron-right toggle"></i>
		</header>

		<div class="menu-bar">
			<div class="menu">
				<!-- Secuencia 1 -->
				<li class="search-box">
					<i class="bx bx-dna icon"></i>
					<div class="field">
						<label class="field-label nav-text" for="seq_1">Secuencia 1</label>
						<input class="seq" type="text" id="seq_1" placeholder="Secuencia 1" value="AAG"
							aria-label="Secuencia 1 (vertical)" />
					</div>
				</li>

				<!-- Secuencia 2 -->
				<li class="search-box">
					<i class="bx bx-dna icon"></i>
					<div class="field">
						<label class="field-label nav-text" for="seq_2">Secuencia 2</label>
						<input class="seq" type="text" id="seq_2" placeholder="Secuencia 2" value="AAG"
							aria-label="Secuencia 2 (horizontal)" />
					</div>
				</li>

				<!-- Match -->
				<li class="search-box">
					<i class="bx bx-check-circle icon"></i>
					<div class="field">
						<label class="field-label nav-text" for="matchScore">Match score</label>
						<input class="params" id="matchScore" type="number" placeholder="Match" value="1"
							aria-label="Match score" />
					</div>
				</li>

				<!-- Mismatch -->
				<li class="search-box">
					<i class="bx bx-x-circle icon"></i>
					<div class="field">
						<label class="field-label nav-text" for="mismatchScore">Mismatch score</label>
						<input class="params" id="mismatchScore" type="number" placeholder="Mismatch" value="-1"
							aria-label="Mismatch score" />
					</div>
				</li>

				<!-- Gap -->
				<li class="search-box">
					<i class="bx bx-minus icon"></i>
					<div class="field">
						<label class="field-label nav-text" for="gapScore">Gap score</label>
						<input class="params" id="gapScore" type="number" placeholder="Gap" value="-2"
							aria-label="Gap score" />
					</div>
				</li>

				<li class="btn-compute">
					<a href="#" id="calculateButton">
						<i class="bx bx-calculator icon"></i>
						<span class="text nav-text">Inicializar</span>
					</a>
				</li>

				<li>
					<a href="#" class="btn-prev" id="anterior">
						<i class="bx bx-left-arrow-alt icon"></i>
						<span class="text nav-text">Anterior</span>
					</a>
				</li>
				<li>
					<a href="#" class="btn-next" id="siguiente">
						<i class="bx bx-right-arrow-alt icon"></i>
						<span class="text nav-text">Siguiente</span>
					</a>
				</li>

				<!-- Resolver (auto) - sin clase btn-compute -->
				<li class="btn-run">
					<a href="#" id="resolver">
						<i class="bx bx-play icon"></i>
						<span class="text nav-text">Resolver (auto)</span>
					</a>
				</li>

				<!-- Resolución instantánea - sin clase btn-compute -->
				<li class="btn-run">
					<a href="#" id="instant">
						<i class="bx bx-fast-forward icon"></i>
						<span class="text nav-text">Resolución instantánea</span>
					</a>
				</li>
			</div>

			<div class="bottom-content">

				<li class="mode">
					<div class="field">
						<select id="algoSelect" class="params">
							<option value="nw">Global (Needleman-Wunsch)</option>
							<option value="sw">Local (Smith-Waterman)</option>
							<option value="ed">Mínimo (Edit Distance)</option>
						</select>
					</div>
					<span class="mode-text text">Global</span>
				</li>
			</div>
		</div>
	</nav>

	<script src="./ed-wf.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.6.1/d3.min.js"></script>
	<script src="./script.js"></script>
	<script src="./inicializar.js"></script>
	<script src="./siguiente.js"></script>
	<script src="./anterior.js"></script>
	<script src="./avanzar.js"></script>
	<script src="./retroceder.js"></script>
	<script src="./auto-run.js"></script>
</body>

</html>
